# Local infrastructure for development: `docker compose up -d`
# (the API and frontend still run on the host with hot reload; Phase 9 containerizes them too)

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sql_assistant
    ports:
      - "5433:5432" # host 5433, so it never clashes with a locally installed Postgres on 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sql_assistant"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant: # vector database, used from Phase 3 onward
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333" # REST API + web dashboard at http://localhost:6333/dashboard
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
